# Single source of truth for the generated Containerfile, entrypoint and
# launcher script. After editing, run `uv run render.py` and commit the output.

[repo]
# Where install.sh downloads the launcher from when not run from a clone.
raw_url = "https://raw.githubusercontent.com/thomwiggers/thom-container/main"

[image]
# Registry path the launcher pulls from and CI pushes to.
name = "ghcr.io/thomwiggers/thom-container"
tag = "latest"
# Debian 13
base = "debian:trixie"

[user]
name = "thom"
# Match the macOS host user (first user is uid 501, group "staff" is gid 20)
# so files in bind mounts line up.
uid = 501
gid = 20
shell = "/usr/bin/zsh"

[dotfiles]
repo = "https://github.com/thomwiggers/chezmoi-dotfiles.git"
# Holds the `packages.brew` list; the Homebrew image layer is cached on its
# contents.
data_url = "https://raw.githubusercontent.com/thomwiggers/chezmoi-dotfiles/main/.chezmoidata.toml"

[container]
# The whole home directory is persisted on the host, per profile.
home = "/home/thom"
# Pristine copy of the home directory baked into the image; used to seed an
# empty persistent home on first start.
home_seed = "/opt/home-seed"
# Where the launcher mounts the folder it was started in.
project = "/project"
# Read-only mount of the host directory holding the unencrypted age key.
key_dir = "/run/host-chezmoi"
# File name of the key inside key_dir.
key_file = "key.txt"
# Read-only mount of the host's ssh known_hosts, added to ssh's
# GlobalKnownHostsFile. Not ~/.ssh/known_hosts, which must stay writable.
host_known_hosts = "/run/host-ssh/known_hosts"
# Paths under home that get a fresh tmpfs per container (e.g. ssh
# ControlMaster sockets, which don't belong on a shared virtiofs mount).
# ~/.config/gh holds the GitHub token the entrypoint logs in with; keep it
# in memory rather than in the persisted home.
ephemeral = [".ssh/sockets", ".config/gh"]

[claude]
# Claude Code's per-project state, relative to home.
projects_dir = ".claude/projects"

[host]
# Persistent home for profile <p> lives at <state_root>/<p>.
state_root = "~/.cache/thom-containers"
profiles = ["private", "work"]
default_profile = "private"
# Host directory containing the unencrypted chezmoi age key.
key_dir = "~/.config/chezmoi"
# Mounted on its own (single-file mounts need container >= 0.12.0); mounting
# ~/.ssh would expose the private keys.
known_hosts = "~/.ssh/known_hosts"
# Apple's container defaults to 4 CPUs / 1 GiB; that is too small for a dev box.
# cpus = 0 means "all host CPUs".
cpus = 0
memory = "8G"
# Prefix for container names: <prefix>-<profile>-<folder>-<hash>.
name_prefix = "dev"
# Pass the host's `gh auth token` into the container, which logs in with it.
gh_token = true

# Optional GitHub account per profile, for `gh auth token --user <name>` when
# the host gh is logged in to several. Profiles not listed use the active one.
[host.github_users]
# work = "my-work-account"
