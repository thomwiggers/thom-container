name: Build image

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rebuild to pick up Debian, nixpkgs and Claude Code updates.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Generated files are up to date
        run: uv run render.py --check
      - name: Ruff
        run: |
          uvx ruff check render.py
          uvx ruff format --check render.py
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Lint scripts
        run: |
          shellcheck entrypoint.sh
          zsh -n bin/devbox
          zsh -n install.sh
          zsh -n tests/smoke.sh
      - name: Smoke tests
        run: tests/smoke.sh

  smoke-macos:
    # The launcher and installer under the real /bin/zsh and BSD userland.
    # `container` stays stubbed: the runner is a VM without nested
    # virtualization.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Lint scripts
        run: |
          zsh -n bin/devbox
          zsh -n install.sh
          zsh -n tests/smoke.sh
      - name: Smoke tests
        run: tests/smoke.sh

  changes:
    # The image is built from Containerfile and entrypoint.sh alone. Pushing a
    # rebuild when only the launcher or docs changed gives `latest` a new
    # digest, and every Mac pulls and unpacks it again. Scheduled and manual
    # runs always build.
    runs-on: ubuntu-slim
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          build=true
          case $GITHUB_EVENT_NAME in
            push|pull_request)
              # Fails for a new branch's all-zero "before": build then.
              if git fetch --quiet --depth=1 origin "$BASE" \
                && git diff --quiet "$BASE" HEAD -- Containerfile entrypoint.sh; then
                build=false
              fi
              ;;
          esac
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: [lint, changes]
    if: needs.changes.outputs.build == 'true'
    # Apple's container runs arm64 Linux; build natively, not under QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build inputs
        id: inputs
        run: |
          image=$(python3 -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["image"]["name"])')
          repo=$(python3 -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["dotfiles"]["repo"])')
          paths=$(python3 -c 'import tomllib; print(*tomllib.load(open("config.toml", "rb"))["dotfiles"]["cache_paths"])')
          # Tree hashes of just the Nix inputs; paths that don't exist are skipped.
          git clone --quiet --depth 1 "$repo" "$RUNNER_TEMP/dotfiles"
          # shellcheck disable=SC2086
          dotfiles_hash=$(git -C "$RUNNER_TEMP/dotfiles" ls-tree HEAD $paths | sha256sum | cut -d' ' -f1)
          {
            echo "image=$image"
            echo "dotfiles_hash=$dotfiles_hash"
            echo "claude_cache_bust=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.inputs.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOTFILES_HASH=${{ steps.inputs.outputs.dotfiles_hash }}
            CLAUDE_CACHE_BUST=${{ steps.inputs.outputs.claude_cache_bust }}
          # Registry cache: the Home Manager layer is too large and too slow to
          # rebuild to trust to the 10 GB, evict-on-pressure GHA cache.
          cache-from: type=registry,ref=${{ steps.inputs.outputs.image }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', steps.inputs.outputs.image) || '' }}
