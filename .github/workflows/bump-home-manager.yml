name: Bump home-manager-config

# home-manager-config pins this repo as a flake input for bin/devbox. Once
# main's image is pushed, have it open a PR updating that input (no PR if
# its lock is already current).
on:
  workflow_run:
    workflows: [Build image]
    types: [completed]
    branches: [main]

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-slim
    steps:
      - name: Run update-flake-lock in home-manager-config
        # Fine-grained PAT with Actions: read and write on that repo;
        # GITHUB_TOKEN can't reach other repositories.
        run: >-
          gh workflow run update-flake-lock.yaml
          --repo thomwiggers/home-manager-config
          -f input=thom-container
        env:
          GH_TOKEN: ${{ secrets.HOME_MANAGER_CONFIG_TOKEN }}
